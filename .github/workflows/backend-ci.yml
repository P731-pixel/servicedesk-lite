name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore backend/ServiceDeskLite.slnx

    - name: Build
      run: dotnet build backend/ServiceDeskLite.slnx --no-restore -warnaserror

    - name: Test
      run: dotnet test backend/ServiceDeskLite.slnx --no-build --verbosity normal